<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 标签页标题由服务器在发出 HTML 前填入。 -->
  <title>{{.Title}}</title>
</head>
<body>
  <!-- 双花括号是模板动作，浏览器收到的是已经填好的文字。 -->
  <h1>{{.Title}}</h1>
  <p>今天学习 {{.Minutes}} 分钟。</p>
</body>
</html>
